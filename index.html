<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101019">
<title>Find Your Music｜找到你的下一首愛歌</title>
<style>
:root{
  --bg:#101019;--panel:#1b1b2a;--text:#f5f3ff;
  --muted:#aaa8bf;--accent:#b39aff;--border:#363449;
}
*{box-sizing:border-box}
body{
  margin:0;color:var(--text);font-family:system-ui,sans-serif;
  background:radial-gradient(ellipse at top right,#302349 0,transparent 55%),var(--bg);
  min-height:100vh;
}
button,a,select{-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{
  outline:3px solid var(--accent);outline-offset:4px;
}
button:disabled{opacity:.4;cursor:default}
main{max-width:960px;margin:auto;padding:28px 22px 60px}
header{display:flex;justify-content:space-between;align-items:center;gap:14px}
.brand{letter-spacing:2px;color:var(--accent);font-size:13px;font-weight:800}
.sub{color:var(--muted);font-size:12px}
h1{font-size:clamp(36px,7vw,64px);line-height:1.15;margin:35px 0 16px}
h2{font-size:clamp(25px,5vw,36px);margin:16px 0}
p{color:var(--muted);line-height:1.75}
.hero{padding:35px 0 16px}
.hero strong{color:var(--accent)}
.pill{
  display:inline-block;border:1px solid var(--border);border-radius:30px;
  padding:7px 12px;font-size:12px;color:var(--muted);margin:5px 5px 0 0;
}
.panel{
  background:var(--panel);border:1px solid var(--border);
  border-radius:24px;padding:clamp(22px,5vw,40px);margin-top:28px;
}
.primary{
  border:0;background:var(--accent);color:#191125;
  padding:15px 24px;border-radius:13px;font-weight:750;
}
.primary:hover{background:#c8b5ff}
.secondary{
  background:transparent;color:var(--text);border:1px solid var(--border);
  padding:11px 16px;border-radius:12px;
}
.secondary:hover{border-color:var(--accent)}
.progress{height:5px;background:#343145;border-radius:10px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);transition:width .25s}
.step{font-size:12px;letter-spacing:2px;color:var(--accent);margin-top:24px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:24px 0}
.option{
  text-align:left;padding:19px;border-radius:15px;border:1px solid var(--border);
  background:#232233;color:var(--text);
}
.option:hover{border-color:#8a76b1;background:#2b293e}
.option[aria-pressed="true"]{
  border-color:var(--accent);background:#39304e;
  box-shadow:0 0 0 1px var(--accent);
}
.option b{display:block;font-size:16px;margin-bottom:6px}
.option small{display:block;color:var(--muted);line-height:1.5}
.controls{display:flex;justify-content:space-between;align-items:center;gap:12px}
.result-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:30px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}
.card{
  background:var(--panel);border:1px solid var(--border);padding:24px;
  border-radius:20px;display:flex;flex-direction:column;
}
.card h3{font-size:23px;margin:12px 0 6px;overflow-wrap:anywhere}
.artist{color:var(--accent);font-size:15px}
.number{color:var(--muted);font-size:12px;letter-spacing:2px}
.tags{margin:14px 0 0}
.tag{font-size:11px;border-radius:6px;background:#302b40;color:#d8cafa;padding:5px 8px;display:inline-block;margin:0 5px 5px 0}
.reason{font-size:14px;flex:1}
.links{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 18px}
.links a{color:#c6b2ff;font-size:13px;text-decoration:none}
.links a:hover{text-decoration:underline}
.feedback{display:flex;gap:8px;flex-wrap:wrap}
.feedback button{font-size:12px;padding:9px 12px}
.summary{display:flex;flex-wrap:wrap;gap:7px;margin:15px 0}
.summary span{font-size:12px;background:#282337;border-radius:30px;padding:8px 12px;color:#d5c5ee}
.note{font-size:12px;margin-top:32px}
.empty{padding:30px;color:var(--muted)}
[hidden]{display:none!important}
@media(max-width:600px){
  .options,.cards{grid-template-columns:1fr}
  .hero{padding-top:15px}
  .result-head{align-items:flex-start}
  header .sub{display:none}
}
@media(prefers-reduced-motion:reduce){
  *{scroll-behavior:auto!important;transition:none!important}
}
</style>
</head>
<body>
<main>
<header>
  <div class="brand">FIND YOUR MUSIC</div>
  <div class="sub">FOLLOW YOUR MOOD. FIND YOUR SOUND.</div>
  <button class="secondary" id="showSaved">♡ 收藏</button>
</header>

<section id="home" class="hero">
  <span class="pill">60 首精選歌曲</span>
  <span class="pill">6 個選擇，探索你的聲音</span>
  <h1>總有一首歌，<br>剛好<strong>懂現在的你。</strong></h1>
  <p>深夜、通勤，或準備重新出發。<br>
     跟著直覺選，找到幾首值得按下播放的歌。</p>
  <button class="primary" id="start">探索我的音樂 →</button>
  <p class="note">不用登入，也不用懂曲風。大約一分鐘就能完成。</p>
</section>

<section id="quiz" class="panel" hidden aria-labelledby="question">
  <div class="progress"><span id="bar"></span></div>
  <div class="step" id="step"></div>
  <h2 id="question" tabindex="-1"></h2>
  <p id="hint"></p>
  <div class="options" id="options"></div>
  <div class="controls">
    <button class="secondary" id="back">← 上一步</button>
    <button class="primary" id="next" disabled>下一題 →</button>
  </div>
</section>

<section id="result" hidden>
  <div class="result-head">
    <div>
      <div class="step">YOUR NEXT FAVORITES</div>
      <h2 id="resultTitle" tabindex="-1">試試這幾首。</h2>
    </div>
    <button class="secondary" id="restart">重新探索 ↻</button>
  </div>
  <p id="resultIntro"></p>
  <div class="summary" id="summary"></div>
  <div class="cards" id="cards"></div>
  <button class="primary" id="refresh">再推薦一組 ↻</button>
</section>

<section id="savedView" hidden>
  <div class="result-head">
    <h2 tabindex="-1" id="savedTitle">你的收藏 ♡</h2>
    <button class="secondary" id="closeSaved">返回</button>
  </div>
  <p>留住對味的歌，下次回到這個瀏覽器還能找到。</p>
  <div class="cards" id="savedCards"></div>
</section>

<p class="note">
  推薦依精選歌庫與人工標籤配對，曲風、情緒及情境帶有主觀性。
  連結會開啟平台搜尋頁，網站本身不播放音樂。
</p>
<div id="announcement" role="status" class="sub"></div>
</main>
