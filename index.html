<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find Your Music｜找到你的下一首歌</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #101018;
  color: #f5f5fa;
  font-family: system-ui, sans-serif;
}
main { max-width: 760px; margin: auto; padding: 48px 22px; }
.logo { color: #b6a1ff; letter-spacing: 3px; font-size: 13px; }
h1 { font-size: clamp(32px, 7vw, 52px); margin-bottom: 12px; }
p { color: #b8b8ca; line-height: 1.7; }
.panel {
  margin-top: 30px; padding: 26px;
  background: #1c1c2a; border: 1px solid #343448;
  border-radius: 22px;
}
label { display: block; margin: 20px 0 8px; font-weight: 600; }
select, button {
  width: 100%; padding: 14px; border-radius: 12px;
  font: inherit; color: white;
}
select { background: #282839; border: 1px solid #494960; }
button {
  margin-top: 26px; background: #8560e8;
  border: none; cursor: pointer; font-weight: 700;
}
button:hover { background: #9775f2; }
button:focus-visible, select:focus-visible, a:focus-visible {
  outline: 3px solid #d5c7ff; outline-offset: 4px;
}
.card {
  background: #1c1c2a; padding: 22px;
  margin: 14px 0; border-radius: 16px;
  border: 1px solid #343448;
}
.card h3 { margin: 0 0 6px; }
.artist { color: #c4afff; }
a { display: inline-block; color: #c4afff; margin-top: 8px; }
.note { font-size: 13px; margin-top: 28px; }
</style>
</head>
<body>
<main>
  <div class="logo">FIND YOUR MUSIC</div>
  <h1>你的下一首愛歌，<br>從這裡開始。</h1>
  <p>告訴我你現在的感覺，找幾首可能對味的歌。</p>

  <form id="quiz" class="panel">
    <label for="mood">你現在想聽什麼感覺？</label>
    <select id="mood">
      <option value="any">都可以，讓我探索</option>
      <option value="happy">開心、想跟著唱</option>
      <option value="sad">有點難過，想被理解</option>
      <option value="chill">放鬆、深夜獨處</option>
      <option value="energy">充滿能量、運動一下</option>
    </select>

    <label for="genre">偏好哪種曲風？</label>
    <select id="genre">
      <option value="any">不限曲風</option>
      <option value="pop">流行 Pop</option>
      <option value="rnb">節奏藍調 R&amp;B</option>
      <option value="indie">獨立／另類 Indie</option>
      <option value="rock">搖滾 Rock</option>
    </select>

    <label for="language">想聽哪種語言？</label>
    <select id="language">
      <option value="any">都可以</option>
      <option value="en">英文</option>
      <option value="zh">中文</option>
    </select>

    <button type="submit">找到我的音樂 →</button>
  </form>

  <section id="results" aria-live="polite"></section>
  <p class="note">
    第一版使用精選歌單與標籤配對，推薦結果供你探索新音樂。
  </p>
</main>

<script>
const songs = [
  { title: "Treasure", artist: "Bruno Mars",
    mood: ["happy", "energy"], genre: ["pop", "rnb"], lang: "en" },
  { title: "When I Was Your Man", artist: "Bruno Mars",
    mood: ["sad", "chill"], genre: ["pop"], lang: "en" },
  { title: "ILYSB", artist: "LANY",
    mood: ["chill", "happy"], genre: ["pop", "indie"], lang: "en" },
  { title: "Malibu Nights", artist: "LANY",
    mood: ["sad", "chill"], genre: ["pop", "indie"], lang: "en" },
  { title: "STAY", artist: "The Kid LAROI & Justin Bieber",
    mood: ["energy", "sad"], genre: ["pop"], lang: "en" },
  { title: "Location", artist: "Khalid",
    mood: ["chill"], genre: ["rnb"], lang: "en" },
  { title: "Blinding Lights", artist: "The Weeknd",
    mood: ["energy", "happy"], genre: ["pop"], lang: "en" },
  { title: "Best Part", artist: "Daniel Caesar feat. H.E.R.",
    mood: ["chill"], genre: ["rnb"], lang: "en" },
  { title: "Creep", artist: "Radiohead",
    mood: ["sad"], genre: ["rock", "indie"], lang: "en" },
  { title: "突然好想你", artist: "五月天",
    mood: ["sad"], genre: ["pop", "rock"], lang: "zh" },
  { title: "派對動物", artist: "五月天",
    mood: ["happy", "energy"], genre: ["pop", "rock"], lang: "zh" },
  { title: "想見你想見你想見你", artist: "八三夭",
    mood: ["sad", "energy"], genre: ["pop", "rock"], lang: "zh" },
  { title: "愛人錯過", artist: "告五人",
    mood: ["energy", "sad"], genre: ["pop", "indie"], lang: "zh" },
  { title: "刻在我心底的名字", artist: "盧廣仲",
    mood: ["sad", "chill"], genre: ["pop"], lang: "zh" },
  { title: "小幸運", artist: "田馥甄",
    mood: ["chill", "sad"], genre: ["pop"], lang: "zh" }
];

document.getElementById("quiz").addEventListener("submit", event => {
  event.preventDefault();
  const mood = document.getElementById("mood").value;
  const genre = document.getElementById("genre").value;
  const language = document.getElementById("language").value;
  const results = document.getElementById("results");

  const ranked = songs
    .filter(song => language === "any" || song.lang === language)
    .map(song => {
      const reasons = [];
      let score = 0;
      if (mood !== "any" && song.mood.includes(mood)) {
        score += 3;
        reasons.push("符合你選擇的心情");
      }
      if (genre !== "any" && song.genre.includes(genre)) {
        score += 2;
        reasons.push("包含你偏好的曲風");
      }
      return { ...song, score, reasons, tie: Math.random() };
    })
    .sort((a, b) => b.score - a.score || a.tie - b.tie)
    .slice(0, 4);

  results.replaceChildren();
  const heading = document.createElement("h2");
  heading.textContent = "試試這幾首 🎧";
  results.appendChild(heading);

  ranked.forEach(song => {
    const card = document.createElement("article");
    card.className = "card";

    const title = document.createElement("h3");
    title.textContent = song.title;
    const artist = document.createElement("div");
    artist.className = "artist";
    artist.textContent = song.artist;

    const reason = document.createElement("p");
    reason.textContent = song.reasons.length
      ? song.reasons.join("，") + "。"
      : "探索推薦：試試你平常可能不會點開的歌曲。";

    const link = document.createElement("a");
    link.textContent = "去 YouTube 找這首歌 ↗";
    link.href = "https://www.youtube.com/results?search_query=" +
      encodeURIComponent(song.artist + " " + song.title);
    link.target = "_blank";
    link.rel = "noopener noreferrer";

    card.append(title, artist, reason, link);
    results.appendChild(card);
  });

  results.scrollIntoView({ behavior: "smooth", block: "start" });
});
</script>
</body>
</html>
